<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Login — SweetNikita Bot Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      font-family:'Segoe UI',sans-serif;
      background:#0f1117;
      color:#e2e8f0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .login-wrap{
      width:100%;max-width:420px;padding:20px;
    }
    .login-logo{
      text-align:center;margin-bottom:32px;
    }
    .logo-icon{
      width:72px;height:72px;border-radius:20px;
      background:linear-gradient(135deg,#5b8dee,#7c3aed);
      display:flex;align-items:center;justify-content:center;
      font-size:34px;margin:0 auto 16px;
    }
    .login-logo h1{font-size:22px;font-weight:700;color:#5b8dee;}
    .login-logo p{font-size:13px;color:#94a3b8;margin-top:4px;}
    .login-card{
      background:#161b27;border:1px solid #2e3a52;
      border-radius:14px;padding:32px;
    }
    .form-group{margin-bottom:18px;}
    .form-label{display:block;font-size:13px;color:#94a3b8;margin-bottom:7px;font-weight:500;}
    .input-wrap{position:relative;}
    .input-wrap i{
      position:absolute;left:14px;top:50%;transform:translateY(-50%);
      color:#94a3b8;font-size:14px;
    }
    .form-control{
      width:100%;padding:11px 14px 11px 40px;
      background:#1e2535;border:1px solid #2e3a52;
      border-radius:8px;color:#e2e8f0;font-size:14px;outline:none;transition:.2s;
    }
    .form-control:focus{border-color:#5b8dee;box-shadow:0 0 0 3px rgba(91,141,238,.12);}
    .btn-login{
      width:100%;padding:12px;border:none;border-radius:8px;
      background:linear-gradient(135deg,#5b8dee,#7c3aed);
      color:#fff;font-size:15px;font-weight:600;cursor:pointer;
      transition:.2s;margin-top:6px;
      display:flex;align-items:center;justify-content:center;gap:8px;
    }
    .btn-login:hover{opacity:.88;transform:translateY(-1px);}
    .alert-error{
      padding:10px 14px;background:rgba(239,68,68,.12);
      border:1px solid rgba(239,68,68,.25);border-radius:8px;
      color:#ef4444;font-size:13px;margin-bottom:16px;
      display:flex;align-items:center;gap:8px;
    }
    .footer-note{text-align:center;font-size:12px;color:#94a3b8;margin-top:24px;}
  </style>
</head>
<body>
<div class="login-wrap">
  <div class="login-logo">
    <div class="logo-icon">🤖</div>
    <h1>SweetNikita Bot</h1>
    <p>Admin Control Panel</p>
  </div>

  <div class="login-card">
    {% if error %}
    <div class="alert-error">
      <i class="fa-solid fa-triangle-exclamation"></i> {{ error }}
    </div>
    {% endif %}

    <form method="POST">
      <div class="form-group">
        <label class="form-label">Username</label>
        <div class="input-wrap">
          <i class="fa-solid fa-user"></i>
          <input type="text" name="username" class="form-control" placeholder="admin" required autofocus/>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-wrap">
          <i class="fa-solid fa-lock"></i>
          <input type="password" name="password" class="form-control" placeholder="••••••••" required/>
        </div>
      </div>
      <button type="submit" class="btn-login">
        <i class="fa-solid fa-right-to-bracket"></i> লগইন করুন
      </button>
    </form>
  </div>

  <div class="footer-note">
    🔒 শুধুমাত্র অনুমোদিত ব্যক্তির জন্য
  </div>
</div>
</body>
</html>
