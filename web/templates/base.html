<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Admin Panel{% endblock %} — SweetNikita Bot</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root {
      --bg:       #0f1117;
      --sidebar:  #161b27;
      --card:     #1e2535;
      --card2:    #252d3d;
      --border:   #2e3a52;
      --accent:   #5b8dee;
      --accent2:  #7c3aed;
      --green:    #22c55e;
      --red:      #ef4444;
      --yellow:   #f59e0b;
      --text:     #e2e8f0;
      --muted:    #94a3b8;
      --radius:   12px;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; }

    /* ── Sidebar ── */
    .sidebar {
      width: 240px; min-height:100vh; background:var(--sidebar);
      border-right:1px solid var(--border); display:flex; flex-direction:column;
      position:fixed; top:0; left:0; z-index:100;
    }
    .sidebar-logo {
      padding:24px 20px 16px;
      border-bottom:1px solid var(--border);
    }
    .sidebar-logo .logo-title {
      font-size:16px; font-weight:700; color:var(--accent);
      display:flex; align-items:center; gap:10px;
    }
    .sidebar-logo .logo-sub { font-size:11px; color:var(--muted); margin-top:4px; }
    .sidebar-logo .bot-badge {
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      width:36px; height:36px; border-radius:10px;
      display:flex; align-items:center; justify-content:center;
      font-size:18px; flex-shrink:0;
    }
    .nav-section { padding:16px 12px 8px; }
    .nav-label { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; padding:0 8px 8px; }
    .nav-item {
      display:flex; align-items:center; gap:12px;
      padding:10px 12px; border-radius:8px; color:var(--muted);
      text-decoration:none; font-size:14px; transition:.2s;
      margin-bottom:2px;
    }
    .nav-item:hover { background:var(--card2); color:var(--text); }
    .nav-item.active { background:linear-gradient(90deg,rgba(91,141,238,.18),transparent); color:var(--accent); border-left:3px solid var(--accent); }
    .nav-item i { width:18px; text-align:center; font-size:15px; }
    .sidebar-footer {
      margin-top:auto; padding:16px; border-top:1px solid var(--border);
      font-size:12px; color:var(--muted);
    }
    .sidebar-footer a { color:var(--red); text-decoration:none; display:flex; align-items:center; gap:8px; }
    .sidebar-footer a:hover { color:#ff6b6b; }

    /* ── Main ── */
    .main { margin-left:240px; flex:1; display:flex; flex-direction:column; min-height:100vh; }
    .topbar {
      height:60px; background:var(--sidebar); border-bottom:1px solid var(--border);
      display:flex; align-items:center; justify-content:space-between;
      padding:0 28px; position:sticky; top:0; z-index:50;
    }
    .topbar-title { font-size:17px; font-weight:600; }
    .topbar-right { display:flex; align-items:center; gap:14px; }
    .bot-status { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--green); }
    .status-dot { width:8px; height:8px; border-radius:50%; background:var(--green); animation:pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .page-content { padding:28px; flex:1; }

    /* ── Cards ── */
    .card {
      background:var(--card); border:1px solid var(--border);
      border-radius:var(--radius); padding:24px; margin-bottom:20px;
    }
    .card-header {
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom:20px; padding-bottom:14px; border-bottom:1px solid var(--border);
    }
    .card-title { font-size:15px; font-weight:600; display:flex; align-items:center; gap:10px; }
    .card-title i { color:var(--accent); }

    /* ── Stats ── */
    .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; margin-bottom:24px; }
    .stat-card {
      background:var(--card); border:1px solid var(--border);
      border-radius:var(--radius); padding:20px;
      display:flex; align-items:center; gap:16px;
    }
    .stat-icon {
      width:48px; height:48px; border-radius:12px;
      display:flex; align-items:center; justify-content:center; font-size:22px;
    }
    .stat-icon.blue  { background:rgba(91,141,238,.15); color:var(--accent); }
    .stat-icon.green { background:rgba(34,197,94,.15);  color:var(--green); }
    .stat-icon.purple{ background:rgba(124,58,237,.15); color:#a78bfa; }
    .stat-icon.yellow{ background:rgba(245,158,11,.15); color:var(--yellow); }
    .stat-val { font-size:26px; font-weight:700; }
    .stat-label { font-size:12px; color:var(--muted); margin-top:2px; }

    /* ── Forms ── */
    .form-group { margin-bottom:18px; }
    .form-label { display:block; font-size:13px; color:var(--muted); margin-bottom:7px; font-weight:500; }
    .form-control {
      width:100%; padding:10px 14px; background:var(--card2);
      border:1px solid var(--border); border-radius:8px;
      color:var(--text); font-size:14px; outline:none; transition:.2s;
    }
    .form-control:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(91,141,238,.12); }
    textarea.form-control { resize:vertical; min-height:100px; font-family:inherit; }
    .form-hint { font-size:11px; color:var(--muted); margin-top:5px; }

    /* ── Toggle ── */
    .toggle-row {
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 16px; background:var(--card2); border-radius:8px;
      border:1px solid var(--border); margin-bottom:10px;
    }
    .toggle-info { display:flex; align-items:center; gap:12px; }
    .toggle-info i { color:var(--accent); width:18px; text-align:center; }
    .toggle-label { font-size:14px; font-weight:500; }
    .toggle-desc { font-size:11px; color:var(--muted); margin-top:2px; }
    .switch { position:relative; width:44px; height:24px; }
    .switch input { opacity:0; width:0; height:0; }
    .slider {
      position:absolute; inset:0; background:#374151; border-radius:24px;
      cursor:pointer; transition:.3s;
    }
    .slider:before {
      content:''; position:absolute; width:18px; height:18px;
      left:3px; top:3px; background:#fff; border-radius:50%; transition:.3s;
    }
    input:checked + .slider { background:var(--accent); }
    input:checked + .slider:before { transform:translateX(20px); }

    /* ── Buttons ── */
    .btn {
      padding:10px 20px; border-radius:8px; border:none;
      font-size:14px; font-weight:600; cursor:pointer; transition:.2s;
      display:inline-flex; align-items:center; gap:8px;
    }
    .btn-primary { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; }
    .btn-primary:hover { opacity:.88; transform:translateY(-1px); }
    .btn-danger  { background:rgba(239,68,68,.15); color:var(--red); border:1px solid rgba(239,68,68,.3); }
    .btn-danger:hover  { background:rgba(239,68,68,.25); }
    .btn-sm { padding:6px 14px; font-size:13px; }

    /* ── Table ── */
    .table-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th { padding:10px 14px; text-align:left; color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; border-bottom:1px solid var(--border); }
    td { padding:12px 14px; border-bottom:1px solid var(--border); vertical-align:middle; }
    tr:last-child td { border-bottom:none; }
    tr:hover td { background:rgba(255,255,255,.02); }

    /* ── Badges ── */
    .badge {
      padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600;
    }
    .badge-green  { background:rgba(34,197,94,.15);  color:var(--green); }
    .badge-red    { background:rgba(239,68,68,.15);  color:var(--red); }
    .badge-yellow { background:rgba(245,158,11,.15); color:var(--yellow); }
    .badge-blue   { background:rgba(91,141,238,.15); color:var(--accent); }

    /* ── Alert ── */
    .alert {
      padding:12px 16px; border-radius:8px; margin-bottom:18px;
      display:flex; align-items:center; gap:10px; font-size:14px;
    }
    .alert-success { background:rgba(34,197,94,.12);  border:1px solid rgba(34,197,94,.25);  color:var(--green); }
    .alert-error   { background:rgba(239,68,68,.12);  border:1px solid rgba(239,68,68,.25);  color:var(--red); }

    /* ── Group breadcrumb ── */
    .breadcrumb { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); margin-bottom:20px; }
    .breadcrumb a { color:var(--muted); text-decoration:none; }
    .breadcrumb a:hover { color:var(--accent); }
    .breadcrumb span { color:var(--text); font-weight:500; }

    /* ── Group nav tabs ── */
    .group-tabs { display:flex; gap:4px; margin-bottom:24px; background:var(--card); padding:6px; border-radius:10px; border:1px solid var(--border); flex-wrap:wrap; }
    .group-tab {
      padding:8px 16px; border-radius:7px; font-size:13px; font-weight:500;
      color:var(--muted); text-decoration:none; transition:.2s;
      display:flex; align-items:center; gap:7px;
    }
    .group-tab:hover { background:var(--card2); color:var(--text); }
    .group-tab.active { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; }

    /* ── Group list card ── */
    .group-item {
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 16px; border-bottom:1px solid var(--border);
    }
    .group-item:last-child { border-bottom:none; }
    .group-avatar {
      width:40px; height:40px; border-radius:10px;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      display:flex; align-items:center; justify-content:center;
      font-size:18px; flex-shrink:0;
    }
    .group-info { flex:1; margin-left:14px; }
    .group-id { font-size:11px; color:var(--muted); margin-top:2px; font-family:monospace; }

    /* ── Responsive ── */
    @media(max-width:768px) {
      .sidebar { width:60px; }
      .sidebar-logo .logo-title span, .sidebar-logo .logo-sub,
      .nav-item span, .nav-label, .sidebar-footer span { display:none; }
      .main { margin-left:60px; }
      .stats-grid { grid-template-columns:1fr 1fr; }
    }
  </style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-title">
      <div class="bot-badge">🤖</div>
      <div>
        <div>SweetNikita</div>
        <div class="logo-sub">Bot Admin Panel</div>
      </div>
    </div>
  </div>

  <nav class="nav-section">
    <div class="nav-label">মেনু</div>
    <a href="{{ url_for('dashboard') }}" class="nav-item {% if active=='dashboard' %}active{% endif %}">
      <i class="fa-solid fa-gauge-high"></i><span>ড্যাশবোর্ড</span>
    </a>
    <a href="{{ url_for('bot_admins') }}" class="nav-item {% if active=='bot_admins' %}active{% endif %}">
      <i class="fa-solid fa-user-shield"></i><span>বট অ্যাডমিন</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <a href="{{ url_for('logout') }}">
      <i class="fa-solid fa-right-from-bracket"></i>
      <span>লগআউট</span>
    </a>
  </div>
</aside>

<!-- Main -->
<div class="main">
  <div class="topbar">
    <div class="topbar-title">{% block page_title %}Admin Panel{% endblock %}</div>
    <div class="topbar-right">
      <div class="bot-status">
        <div class="status-dot"></div>
        বট চালু আছে
      </div>
    </div>
  </div>

  <div class="page-content">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ 'success' if cat == 'success' else 'error' }}">
          <i class="fa-solid fa-{{ 'circle-check' if cat == 'success' else 'triangle-exclamation' }}"></i>
          {{ msg }}
        </div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </div>
</div>

</body>
</html>
